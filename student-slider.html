<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Placements — IIMT</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Outfit:wght@300;400;500&display=swap"
    rel="stylesheet">
</head>

<body>

  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0
    }

    :root {
      --bg: #faf9f7;
      --ink: #1c1c1c;
      --muted: #9a9690;
      --rule: #e2dfd9;
      --accent: #c0392b;
    }

    html,
    body {
      background: var(--bg);
      min-height: 100vh;
      font-family: 'Outfit', sans-serif;
      color: var(--ink);
      overflow-x: hidden;
    }

    /* ── Section wrapper ── */
    .placement-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 72px 0 80px;
    }

    /* ── Header ── */
    .ph {
      text-align: center;
      margin-bottom: 56px;
      padding: 0 24px;
    }

    .ph-tag {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 18px;
    }

    .ph-tag span {
      display: inline-block;
      width: 28px;
      height: 1px;
      background: var(--rule);
    }

    .ph h2 {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 300;
      font-size: clamp(36px, 5vw, 62px);
      line-height: 1.1;
      letter-spacing: -0.5px;
      color: var(--ink);
      margin-bottom: 14px;
    }

    .ph h2 em {
      font-style: italic;
      color: var(--accent);
    }

    .ph p {
      font-size: 14px;
      font-weight: 300;
      color: var(--muted);
      letter-spacing: 0.3px;
    }

    /* ── Slider ── */
    .s-outer {
      width: 100%;
      position: relative;
    }

    /* soft fade edges */
    .s-outer::before,
    .s-outer::after {
      content: '';
      position: absolute;
      top: 0;
      bottom: 0;
      width: 80px;
      z-index: 2;
      pointer-events: none;
    }

    .s-outer::before {
      left: 0;
      background: linear-gradient(to right, var(--bg), transparent)
    }

    .s-outer::after {
      right: 0;
      background: linear-gradient(to left, var(--bg), transparent)
    }

    .s-viewport {
      overflow: hidden;
      cursor: grab;
      user-select: none;
    }

    .s-viewport:active {
      cursor: grabbing
    }

    .s-track {
      display: flex;
      align-items: center;
      gap: 20px;
      will-change: transform;
      transition: transform 0.72s cubic-bezier(0.23, 1, 0.32, 1);
    }

    .s-track.snap {
      transition: none !important
    }

    /* ── Image tile ── */
    .s-tile {
      flex: 0 0 var(--tw, 320px);
      border-radius: 16px;
      overflow: hidden;
      position: relative;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.07);
      transition: box-shadow 0.35s ease, transform 0.35s ease;
      background: #f0ece7;
      line-height: 0;
    }

    .s-tile:hover {
      box-shadow: 0 12px 48px rgba(0, 0, 0, 0.13);
      transform: translateY(-4px) scale(1.01);
    }

    .s-tile img {
      width: 100%;
      height: auto;
      display: block;
      pointer-events: none;
      border-radius: 16px;
    }

    /* ── Controls ── */
    .s-controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 20px;
      margin-top: 44px;
    }

    .s-btn {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: 1px solid var(--rule);
      background: transparent;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--ink);
      transition: all 0.22s ease;
    }

    .s-btn:hover {
      background: var(--ink);
      border-color: var(--ink);
      color: var(--bg);
    }

    .s-btn svg {
      display: block;
      flex-shrink: 0
    }

    .s-dots {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .s-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--rule);
      border: none;
      cursor: pointer;
      padding: 0;
      transition: all 0.3s ease;
    }

    .s-dot.on {
      background: var(--accent);
      width: 20px;
      border-radius: 3px;
    }

    /* ── Responsive ── */
    @media(max-width:900px) {

      .s-outer::before,
      .s-outer::after {
        width: 40px
      }
    }

    @media(max-width:560px) {
      .ph {
        margin-bottom: 40px
      }

      .s-outer::before,
      .s-outer::after {
        width: 20px
      }
    }
  </style>

  <section class="placement-section">

    <div class="ph">
      <div class="ph-tag"><span></span>IIMT Group of Colleges<span></span></div>
      <h2>Our students are<br>getting placed <em>everywhere</em></h2>
      <p>Bright minds. Real companies. Remarkable careers.</p>
    </div>

    <div class="s-outer">
      <div class="s-viewport" id="vp">
        <div class="s-track" id="tr"></div>
      </div>
    </div>

    <div class="s-controls">
      <button class="s-btn" id="bPrev" aria-label="Previous">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
          <path d="M10 3L5 8L10 13" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"
            stroke-linejoin="round" />
        </svg>
      </button>
      <div class="s-dots" id="dots"></div>
      <button class="s-btn" id="bNext" aria-label="Next">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
          <path d="M6 3L11 8L6 13" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"
            stroke-linejoin="round" />
        </svg>
      </button>
    </div>

  </section>

  <script>
    const imgs = ["/img/slider/1.webp", "/img/slider/2.webp", "/img/slider/3.webp", "/img/slider/4.webp", "/img/slider/5.webp", "/img/slider/6.webp", "/img/slider/7.webp", "/img/slider/8.webp", "/img/slider/9.webp", "/img/slider/10.webp"];
    const N = imgs.length;
    const GAP = 20;
    const CLONES = 4;

    const vp = document.getElementById('vp');
    const tr = document.getElementById('tr');
    const dots = document.getElementById('dots');
    const bP = document.getElementById('bPrev');
    const bN = document.getElementById('bNext');

    let perView = 3, tileW = 320, cur = CLONES, tx = 0, timer = null;
    let dragOn = false, dragX0 = 0, dragDelta = 0;

    function cpv() { return window.innerWidth < 560 ? 1 : window.innerWidth < 900 ? 2 : 3; }
    function ctw() { return Math.floor((vp.clientWidth - GAP * (perView - 1)) / perView); }

    function build() {
      tr.innerHTML = '';
      perView = cpv();
      tileW = ctw();

      const all = [...imgs.slice(-CLONES), ...imgs, ...imgs.slice(0, CLONES)];
      all.forEach(src => {
        const d = document.createElement('div');
        d.className = 's-tile';
        d.style.cssText = `--tw:${tileW}px;flex-basis:${tileW}px;min-width:${tileW}px`;
        const img = document.createElement('img');
        img.src = src; img.alt = ''; img.draggable = false;
        img.loading = 'lazy';
        d.appendChild(img);
        tr.appendChild(d);
      });

      cur = CLONES;
      go(cur, true);
      buildDots();
    }

    function offset(i) { return -(i * (tileW + GAP)); }

    function go(i, instant = false) {
      cur = i;
      tx = offset(i);
      if (instant) { tr.classList.add('snap'); tr.style.transform = `translateX(${tx}px)`; void tr.offsetWidth; tr.classList.remove('snap'); }
      else tr.style.transform = `translateX(${tx}px)`;
      updDots();
    }

    function realIdx() { return ((cur - CLONES) % N + N) % N; }

    tr.addEventListener('transitionend', () => {
      if (cur <= CLONES - 1) { cur = CLONES + (N - (CLONES - cur)); go(cur, true); }
      else if (cur >= CLONES + N) { cur = CLONES + (cur - CLONES - N); go(cur, true); }
      updDots();
    });

    function buildDots() {
      dots.innerHTML = '';
      imgs.forEach((_, i) => {
        const b = document.createElement('button');
        b.className = 's-dot' + (i === realIdx() ? ' on' : '');
        b.setAttribute('aria-label', `Slide ${i + 1}`);
        b.onclick = () => { go(CLONES + i); reset(); };
        dots.appendChild(b);
      });
    }
    function updDots() {
      const ri = realIdx();
      dots.querySelectorAll('.s-dot').forEach((d, i) => d.classList.toggle('on', i === ri));
    }

    function next() { go(cur + 1); reset(); }
    function prev() { go(cur - 1); reset(); }

    bN.onclick = next; bP.onclick = prev;

    function startAuto() { timer = setInterval(() => go(cur + 1), 3000); }
    function reset() { clearInterval(timer); startAuto(); }

    // drag/swipe
    vp.addEventListener('mousedown', e => { dragOn = true; dragX0 = e.clientX; dragDelta = 0; tr.classList.add('snap'); });
    window.addEventListener('mousemove', e => {
      if (!dragOn) return;
      dragDelta = e.clientX - dragX0;
      tr.style.transform = `translateX(${tx + dragDelta}px)`;
    });
    window.addEventListener('mouseup', () => {
      if (!dragOn) return;
      dragOn = false; tr.classList.remove('snap');
      if (dragDelta < -60) next();
      else if (dragDelta > 60) prev();
      else go(cur);
    });
    vp.addEventListener('touchstart', e => { dragOn = true; dragX0 = e.touches[0].clientX; dragDelta = 0; tr.classList.add('snap'); }, { passive: true });
    vp.addEventListener('touchmove', e => {
      if (!dragOn) return;
      dragDelta = e.touches[0].clientX - dragX0;
      tr.style.transform = `translateX(${tx + dragDelta}px)`;
    }, { passive: true });
    vp.addEventListener('touchend', () => {
      if (!dragOn) return;
      dragOn = false; tr.classList.remove('snap');
      if (dragDelta < -60) next();
      else if (dragDelta > 60) prev();
      else go(cur);
    });

    vp.addEventListener('mouseenter', () => clearInterval(timer));
    vp.addEventListener('mouseleave', () => startAuto());

    window.addEventListener('resize', () => { build(); clearInterval(timer); startAuto(); });

    build();
    startAuto();
  </script>
</body>

</html>
